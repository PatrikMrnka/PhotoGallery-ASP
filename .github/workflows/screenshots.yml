name: Screenshots

# Regenerates the README screenshots from the Docker image with demo data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the application
        run: |
          docker build --tag photogallery-asp .
          docker run --detach --name app --publish 8080:8080 --env Demo__Enabled=true photogallery-asp
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/healthz; then break; fi
            sleep 2
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture screenshots
        run: python tools/take_screenshots.py http://localhost:8080 docs/screenshots

      - name: Application log
        if: always()
        run: docker logs app

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
