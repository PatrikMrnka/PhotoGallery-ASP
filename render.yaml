# Render Blueprint for the public live demo (https://render.com/docs/blueprint-spec).
# The free plan has no persistent disk, so the demo starts with fresh sample data after every restart.
services:
  - type: web
    name: photogallery-asp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass  # deploy only after CI succeeds
    envVars:
      - key: PORT
        value: "8080"
      - key: Demo__Enabled
        value: "true"
      - key: Demo__ResetOnStartup
        value: "true"
      - key: Upload__MaxFileBytes
        value: "10485760"
      - key: Upload__MaxFilesPerRequest
        value: "10"
      - key: Upload__MaxPhotosPerUser
        value: "30"
      - key: Upload__MaxPixels
        value: "24000000"
